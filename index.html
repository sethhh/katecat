<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ff9f43">
<title>Kate Cat 🐱</title>
<!--
  SOUNDS: place these beside kate-cat.html:
  1. kitten-sfx.mp3   https://pixabay.com/sound-effects/kitten-sfx-329685/
  2. angry-cat-hq.mp3 https://pixabay.com/sound-effects/angry-cat-hq-sound-effect-240675/
  Pixabay Content License — no attribution required.
  If files missing, synthesized sounds play automatically.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Andika:ital,wght@0,400;0,700;1,400&family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --orange:#ff9f43;--dark:#ee5a24;--cream:#fff5e6;--soft:#ffecd2;
  --purple:#a29bfe;--green:#00b894;--pink:#fd79a8;--blue:#74b9ff;
  --teal:#00cec9;--ink:#2d3436;--muted:#636e72;--light:#b2bec3;
  --white:#ffffff;--correct-bg:#d4efdf;--wrong-bg:#fde8e8;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;font-family:'Andika',sans-serif;background:var(--cream);overflow:hidden;overscroll-behavior:none}
button{font-family:'Andika',sans-serif;cursor:pointer}
.screen{display:none;width:100%;height:100%;position:absolute;top:0;left:0;flex-direction:column;align-items:center;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.screen.active{display:flex}

/* HOME */
#home{background:linear-gradient(155deg,var(--cream) 0%,var(--soft) 100%);padding:0 1rem 2rem}
.home-top{width:100%;display:flex;flex-direction:column;align-items:center;padding:1.25rem 0 .5rem;position:relative}
.fs-btn{position:absolute;right:0;top:1.25rem;background:rgba(255,159,67,.12);border:1.5px solid var(--orange);border-radius:10px;padding:.28rem .45rem;color:var(--dark);display:flex;align-items:center;justify-content:center}
.fs-btn svg{width:18px;height:18px;stroke:var(--dark);fill:none;stroke-width:2;stroke-linecap:round}
.cat-svg{width:110px;height:110px;animation:bob 3s ease-in-out infinite;margin-bottom:.2rem;touch-action:manipulation}
.cat-svg.squish{animation:squish .35s cubic-bezier(.36,1.56,.64,1) forwards, bob 3s ease-in-out infinite .35s}
@keyframes squish{0%{transform:scale(1)}30%{transform:scale(1.3,.75)}65%{transform:scale(.88,1.18)}100%{transform:scale(1)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-7px) rotate(1.5deg)}}
.game-title{font-family:'Baloo 2',cursive;font-size:2.1rem;font-weight:800;color:var(--dark);line-height:1}
.game-tag{font-size:.78rem;color:var(--muted);margin-bottom:1rem;font-family:'Andika',sans-serif}
.stats-bar{display:flex;gap:8px;width:100%;max-width:400px;margin-bottom:1rem}
.s-chip{flex:1;background:var(--white);border-radius:14px;padding:.55rem .4rem;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.s-num{font-family:'Baloo 2',cursive;font-size:1.4rem;font-weight:800;line-height:1;display:block}
.s-lbl{font-size:.6rem;font-weight:700;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.cat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:100%;max-width:400px;margin-bottom:10px}
.c-card{background:var(--white);border-radius:20px;padding:.9rem .7rem;border:none;text-align:center;box-shadow:0 3px 0 rgba(0,0,0,.08);transition:transform .1s,box-shadow .1s;position:relative;overflow:hidden}
.c-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;border-radius:20px 20px 0 0}
.c-card:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.08)}
.cc-emo{font-size:1.7rem;display:block;margin-bottom:3px}
.cc-name{font-family:'Baloo 2',cursive;font-size:.88rem;font-weight:700;color:var(--ink);display:block;line-height:1.2}
.cc-cnt{font-size:.62rem;color:var(--muted);display:block;margin-top:2px}
.cc-bar{height:5px;border-radius:3px;background:#f0f0f0;margin-top:7px;overflow:hidden}
.cc-fill{height:100%;border-radius:3px;transition:width .5s ease}
.action-col{display:flex;flex-direction:column;gap:8px;width:100%;max-width:400px}
.btn-missed{background:var(--purple);color:#3d3a99;border:none;border-radius:16px;padding:.8rem;font-family:'Baloo 2',cursive;font-size:.95rem;font-weight:700;box-shadow:0 3px 0 #6c5ce7;transition:transform .1s}
.btn-missed:active{transform:translateY(2px);box-shadow:0 1px 0 #6c5ce7}
.btn-missed:disabled{opacity:.38;cursor:default;transform:none}
.btn-gallery{background:var(--green);color:#005a3e;border:none;border-radius:16px;padding:.8rem;font-family:'Baloo 2',cursive;font-size:.95rem;font-weight:700;box-shadow:0 3px 0 #007a55;transition:transform .1s}
.btn-gallery:active{transform:translateY(2px);box-shadow:0 1px 0 #007a55}
.btn-lookup{background:var(--blue);color:#0057a8;border:none;border-radius:16px;padding:.8rem;font-family:'Baloo 2',cursive;font-size:.95rem;font-weight:700;box-shadow:0 3px 0 #0984e3;transition:transform .1s}
.btn-lookup:active{transform:translateY(2px);box-shadow:0 1px 0 #0984e3}
.btn-custom{background:var(--teal);color:#005a57;border:none;border-radius:16px;padding:.8rem;font-family:'Baloo 2',cursive;font-size:.95rem;font-weight:700;box-shadow:0 3px 0 #009896;transition:transform .1s}
.btn-custom:active{transform:translateY(2px);box-shadow:0 1px 0 #009896}
.btn-reset{background:none;border:none;color:var(--light);font-size:.7rem;text-decoration:underline;padding:.25rem;text-align:center}

/* PLAY */
#play{background:linear-gradient(155deg,var(--cream) 0%,var(--soft) 100%);overflow:hidden}
.play-hdr{width:100%;display:flex;align-items:center;justify-content:space-between;padding:.85rem 1rem .35rem;flex-shrink:0}
.btn-back{background:var(--white);border:none;border-radius:11px;padding:.38rem .75rem;font-size:.78rem;font-weight:700;color:var(--muted);box-shadow:0 2px 6px rgba(0,0,0,.08)}
.play-lbl{font-family:'Baloo 2',cursive;font-size:.95rem;font-weight:700;color:var(--dark)}
.play-cnt{font-size:.78rem;font-weight:700;color:var(--muted);min-width:3.2rem;text-align:right}
.prog-track{width:calc(100% - 2rem);margin:0 1rem;height:7px;background:rgba(0,0,0,.07);border-radius:4px;overflow:hidden;flex-shrink:0}
.prog-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--orange),var(--dark));transition:width .4s cubic-bezier(.34,1.56,.64,1)}
.paws-row{display:flex;justify-content:center;flex-wrap:wrap;gap:5px;padding:.35rem 1rem;flex-shrink:0}
.paw{font-size:.9rem;opacity:.18;transition:opacity .3s}
.paw.ok{opacity:1}.paw.ng{opacity:1;filter:grayscale(1) opacity(.45)}
.card-zone{flex:1;display:flex;align-items:center;justify-content:center;padding:.4rem .75rem;width:100%;position:relative}
.flashcard{background:var(--white);border-radius:30px;width:100%;max-width:560px;min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 7px 0 rgba(0,0,0,.07),0 2px 20px rgba(0,0,0,.06);padding:1.75rem 1.25rem;position:relative;will-change:transform}
.card-ears{position:absolute;top:-14px;width:100%;display:flex;justify-content:space-between;padding:0 28px;pointer-events:none}
.ear{width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-bottom:22px solid var(--white)}
.card-tag-lbl{font-size:.6rem;font-weight:700;letter-spacing:.1em;color:var(--light);text-transform:uppercase;margin-bottom:.65rem}
.card-word{font-family:'Andika',sans-serif;font-size:clamp(2.8rem,14vw,5rem);font-weight:700;color:var(--ink);line-height:1.3;text-align:center;white-space:nowrap;width:100%;display:block;padding-bottom:0.15em}
.card-hint{margin-top:.55rem;font-size:.75rem;color:var(--light);text-align:center;font-weight:700}
.flashcard.anim-ok{animation:okPop .48s cubic-bezier(.34,1.56,.64,1) forwards}
.flashcard.anim-ng{animation:ngShake .42s ease forwards}
.flashcard.anim-next{animation:cardNext .28s ease forwards}
@keyframes okPop{0%{transform:scale(1);background:var(--white)}30%{transform:scale(1.07);background:var(--correct-bg)}70%{transform:scale(.97)}100%{transform:scale(1);background:var(--white)}}
@keyframes ngShake{0%,100%{transform:translateX(0);background:var(--white)}15%{transform:translateX(-11px) rotate(-1.8deg);background:var(--wrong-bg)}35%{transform:translateX(11px) rotate(1.8deg)}55%{transform:translateX(-7px)}75%{transform:translateX(7px)}90%{transform:translateX(-2px);background:#fff5f5}}
@keyframes cardNext{0%{transform:scale(1) rotateY(0);opacity:1}45%{transform:scale(.86) rotateY(14deg);opacity:.25}100%{transform:scale(1) rotateY(0);opacity:1}}
.ans-zone{width:100%;padding:.4rem 1rem .9rem;display:flex;flex-direction:column;gap:7px;flex-shrink:0}
.main-btns{display:flex;gap:10px}
.btn-ng,.btn-ok{flex:1;border:none;border-radius:20px;padding:.9rem .5rem;font-family:'Baloo 2',cursive;font-size:1.1rem;font-weight:700;transition:transform .1s}
.btn-ng{background:#fab1a0;color:#c0392b;box-shadow:0 5px 0 #e17055}
.btn-ng:active{transform:translateY(4px);box-shadow:0 1px 0 #e17055}
.btn-ok{background:#55efc4;color:#005a3e;box-shadow:0 5px 0 #00b894}
.btn-ok:active{transform:translateY(4px);box-shadow:0 1px 0 #00b894}
.btn-skip{background:rgba(0,0,0,.05);border:none;border-radius:12px;padding:.45rem;font-size:.72rem;font-weight:700;color:var(--muted);text-align:center}

/* RESULTS */
#results{background:linear-gradient(155deg,var(--cream) 0%,var(--soft) 100%);padding:1.5rem 1rem 2rem;align-items:center}
.res-cat{font-size:3.5rem;animation:bob 2s ease-in-out infinite;margin-bottom:.2rem}
.res-title{font-family:'Baloo 2',cursive;font-size:1.7rem;font-weight:800;color:var(--dark);text-align:center}
.res-sub{font-size:.82rem;color:var(--muted);margin-bottom:1rem;text-align:center}
.score-ring{width:105px;height:105px;border-radius:50%;background:var(--white);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 5px 0 var(--orange);margin-bottom:1.1rem}
.score-pct{font-family:'Baloo 2',cursive;font-size:1.9rem;font-weight:800;color:var(--dark);line-height:1}
.score-lbl{font-size:.62rem;color:var(--muted);font-weight:700}
.res-list{width:100%;max-width:360px;display:flex;flex-direction:column;gap:5px;margin-bottom:1.1rem}
.res-sec{font-family:'Baloo 2',cursive;font-size:.78rem;font-weight:700;color:var(--muted);padding:.2rem 4px 0}
.res-row{background:var(--white);border-radius:12px;padding:.5rem .9rem;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 0 rgba(0,0,0,.05)}
.res-word{font-family:'Andika',sans-serif;font-size:1rem;font-weight:700}
.res-dot{width:10px;height:10px;border-radius:50%}
.res-actions{display:flex;flex-direction:column;gap:8px;width:100%;max-width:360px}
.btn-primary{background:var(--dark);color:var(--white);border:none;border-radius:16px;padding:.95rem;font-family:'Baloo 2',cursive;font-size:.95rem;font-weight:700;box-shadow:0 4px 0 #c0392b;transition:transform .1s}
.btn-primary:active{transform:translateY(3px);box-shadow:0 1px 0 #c0392b}
.btn-secondary{background:var(--white);color:var(--dark);border:2px solid var(--orange);border-radius:16px;padding:.85rem;font-family:'Baloo 2',cursive;font-size:.95rem;font-weight:700}
.btn-secondary:active{background:var(--soft)}
.perfect-banner{background:linear-gradient(135deg,var(--green),#55efc4);color:#003d2a;border-radius:14px;padding:.8rem;text-align:center;font-family:'Baloo 2',cursive;font-size:1rem;font-weight:700;box-shadow:0 4px 0 #007a55}

/* GALLERY */
#gallery{background:linear-gradient(155deg,var(--cream) 0%,var(--soft) 100%);padding:0 1rem 2rem}
.gallery-hdr{width:100%;display:flex;align-items:center;gap:.65rem;padding:1rem 0 .65rem;position:sticky;top:0;background:linear-gradient(155deg,var(--cream) 0%,var(--soft) 100%);z-index:10;flex-shrink:0}
.gallery-title{font-family:'Baloo 2',cursive;font-size:1.35rem;font-weight:800;color:var(--dark);flex:1}
.g-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.65rem;color:var(--muted);font-size:.88rem;text-align:center;padding:3rem 2rem;flex:1;width:100%}
.g-empty-cat{font-size:2.8rem}
.m-section{width:100%;margin-bottom:1rem}
.m-sec-hd{font-family:'Baloo 2',cursive;font-size:.82rem;font-weight:700;color:var(--muted);margin-bottom:5px;display:flex;align-items:center;gap:5px}
.m-wrap{display:flex;flex-wrap:wrap;gap:6px}
.m-chip{background:var(--white);border:2px solid var(--green);border-radius:20px;padding:.3rem .8rem;font-family:'Andika',sans-serif;font-size:.95rem;font-weight:700;color:var(--ink);box-shadow:0 2px 0 #007a55;animation:chipPop .28s cubic-bezier(.34,1.56,.64,1) both}
@keyframes chipPop{0%{transform:scale(.65);opacity:0}100%{transform:scale(1);opacity:1}}

/* LOOKUP */
#lookup{background:linear-gradient(155deg,var(--cream) 0%,var(--soft) 100%);padding:0 1rem 2rem}
.lookup-hdr{width:100%;display:flex;align-items:center;gap:.65rem;padding:1rem 0 .65rem;position:sticky;top:0;background:linear-gradient(155deg,var(--cream) 0%,var(--soft) 100%);z-index:10}
.lookup-title{font-family:'Baloo 2',cursive;font-size:1.35rem;font-weight:800;color:var(--dark);flex:1}
.search-wrap{width:100%;max-width:400px;position:relative;margin-bottom:1rem}
.search-input{width:100%;border:2px solid rgba(0,0,0,.1);border-radius:16px;padding:.75rem 1rem .75rem 2.8rem;font-family:'Andika',sans-serif;font-size:1rem;font-weight:700;background:var(--white);color:var(--ink);outline:none;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.search-input:focus{border-color:var(--orange)}
.search-icon{position:absolute;left:1rem;top:50%;transform:translateY(-50%);font-size:1rem;pointer-events:none}
.word-card{background:var(--white);border-radius:22px;padding:1.25rem;width:100%;max-width:400px;box-shadow:0 4px 0 rgba(0,0,0,.07);margin-bottom:.75rem}
.wc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:.75rem}
.wc-word{font-family:'Andika',sans-serif;font-size:2rem;font-weight:700;color:var(--ink);line-height:1}
.wc-cat{font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:.25rem .65rem;border-radius:20px;color:var(--white)}
.wc-stats{display:flex;gap:8px;margin-bottom:.85rem}
.wc-stat{flex:1;background:var(--cream);border-radius:12px;padding:.5rem .3rem;text-align:center}
.wc-stat-n{font-family:'Baloo 2',cursive;font-size:1.15rem;font-weight:800;line-height:1;display:block}
.wc-stat-l{font-size:.58rem;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.wc-timeline-hd{font-size:.7rem;font-weight:700;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;margin-bottom:.4rem}
.timeline{display:flex;flex-direction:column;gap:4px;max-height:180px;overflow-y:auto}
.tl-row{display:flex;align-items:center;gap:.5rem;font-size:.78rem;font-weight:600}
.tl-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tl-time{color:var(--muted);flex:1;font-size:.7rem}
.tl-label{font-weight:700}
.trend-badge{display:inline-flex;align-items:center;gap:4px;border-radius:20px;padding:.25rem .65rem;font-size:.72rem;font-weight:700;margin-bottom:.7rem}
.wc-no-data{color:var(--muted);font-size:.85rem;text-align:center;padding:.75rem 0}
.lookup-list{display:flex;flex-direction:column;gap:6px;width:100%;max-width:400px}
.ll-row{background:var(--white);border-radius:14px;padding:.6rem 1rem;display:flex;align-items:center;justify-content:space-between;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.05);transition:transform .1s}
.ll-row:active{transform:scale(.98)}
.ll-word{font-family:'Andika',sans-serif;font-size:1rem;font-weight:700}
.ll-meta{display:flex;gap:5px;align-items:center}
.ll-dot{width:8px;height:8px;border-radius:50%}
.ll-pct{font-size:.7rem;font-weight:700;color:var(--muted)}

/* CUSTOM LIST */
#custom{background:linear-gradient(155deg,var(--cream) 0%,var(--soft) 100%);padding:0 1rem 2rem}
.custom-hdr{width:100%;display:flex;align-items:center;gap:.65rem;padding:1rem 0 .65rem;position:sticky;top:0;background:linear-gradient(155deg,var(--cream) 0%,var(--soft) 100%);z-index:10;flex-shrink:0}
.custom-title{font-family:'Baloo 2',cursive;font-size:1.35rem;font-weight:800;color:var(--dark);flex:1}
.add-word-row{display:flex;gap:8px;width:100%;max-width:400px;margin-bottom:1rem}
.add-word-input{flex:1;border:2px solid rgba(0,0,0,.1);border-radius:14px;padding:.65rem 1rem;font-family:'Andika',sans-serif;font-size:1rem;font-weight:700;background:var(--white);color:var(--ink);outline:none}
.add-word-input:focus{border-color:var(--teal)}
.btn-add-word{background:var(--teal);color:white;border:none;border-radius:14px;padding:.65rem 1.1rem;font-family:'Baloo 2',cursive;font-size:.95rem;font-weight:700;box-shadow:0 3px 0 #009896;white-space:nowrap}
.btn-add-word:active{transform:translateY(2px);box-shadow:0 1px 0 #009896}
.custom-word-list{display:flex;flex-wrap:wrap;gap:8px;width:100%;max-width:400px;margin-bottom:1rem}
.custom-chip{display:flex;align-items:center;gap:6px;background:var(--white);border-radius:14px;padding:.4rem .75rem;box-shadow:0 2px 0 rgba(0,0,0,.06)}
.custom-chip-word{font-family:'Andika',sans-serif;font-size:1rem;font-weight:700;color:var(--ink)}
.custom-chip-status{width:8px;height:8px;border-radius:50%}
.custom-chip-del{background:none;border:none;color:var(--light);font-size:1rem;line-height:1;padding:0 0 0 2px;cursor:pointer}
.custom-chip-del:active{color:#e17055}
.custom-empty{color:var(--muted);font-size:.85rem;text-align:center;padding:1.5rem;width:100%;max-width:400px}
.btn-practice-custom{width:100%;max-width:400px;background:var(--teal);color:#005a57;border:none;border-radius:16px;padding:.85rem;font-family:'Baloo 2',cursive;font-size:.95rem;font-weight:700;box-shadow:0 3px 0 #009896;transition:transform .1s;margin-top:.5rem}
.btn-practice-custom:active{transform:translateY(2px);box-shadow:0 1px 0 #009896}
.btn-practice-custom:disabled{opacity:.38;cursor:default;transform:none}

/* OVERLAYS */
.hiss-overlay{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:998;display:flex;align-items:center;justify-content:center;opacity:0;font-size:2.8rem}
.hiss-overlay.show{animation:hissFlash .52s ease forwards}
@keyframes hissFlash{0%{opacity:0}25%{opacity:1}80%{opacity:1}100%{opacity:0}}
.particle{position:fixed;pointer-events:none;font-size:1.3rem;z-index:999;animation:pFly 1s ease-out forwards}
@keyframes pFly{0%{transform:translateY(0) scale(1) rotate(0deg);opacity:1}100%{transform:translateY(-115px) scale(.25) rotate(50deg);opacity:0}}
.confetti-cont{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:1000;overflow:hidden}
.conf{position:absolute;top:-10px;font-size:1.2rem;animation:confFall linear forwards}
@keyframes confFall{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:.4}}
</style>
</head>
<body>

<div class="hiss-overlay" id="hissOverlay">😾</div>
<div class="confetti-cont" id="confettiCont"></div>

<!-- HOME -->
<div id="home" class="screen active">
  <div class="home-top">
    <button class="fs-btn" id="fsBtn" onclick="toggleFS()" title="Full screen">
      <svg viewBox="0 0 24 24"><path d="M3 3h6M3 3v6M3 3l6 6M21 3h-6M21 3v6M21 3l-6 6M3 21h6M3 21v-6M3 21l6-6M21 21h-6M21 21v-6M21 21l-6-6" stroke-linejoin="round"/></svg>
    </button>
    <svg class="cat-svg" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" onclick="purrHeroCat(this)" style="cursor:pointer">
      <ellipse cx="60" cy="82" rx="32" ry="28" fill="#ff9f43"/>
      <circle cx="60" cy="48" r="30" fill="#ff9f43"/>
      <polygon points="36,28 28,8 50,22" fill="#ff9f43"/>
      <polygon points="84,28 92,8 70,22" fill="#ff9f43"/>
      <polygon points="37,26 31,13 48,23" fill="#fab1a0"/>
      <polygon points="83,26 89,13 72,23" fill="#fab1a0"/>
      <ellipse cx="48" cy="44" rx="8" ry="9" fill="white"/><ellipse cx="72" cy="44" rx="8" ry="9" fill="white"/>
      <ellipse cx="49" cy="45" rx="5" ry="6" fill="#2d3436"/><ellipse cx="73" cy="45" rx="5" ry="6" fill="#2d3436"/>

/* ═══ CUSTOM WORD LIST ═══ */
const CUSTOM_CAT_ID = '__custom__';
let customWords = [];
try { customWords = JSON.parse(localStorage.getItem('katecat_custom') || '[]'); } catch(e){}
function saveCustom(){ localStorage.setItem('katecat_custom', JSON.stringify(customWords)); }

function addCustomWord(){
  const input = document.getElementById('addWordInput');
  const w = input.value.trim();
  if(!w) return;
  if(!customWords.includes(w)){
    customWords.push(w);
    saveCustom();
  }
  input.value = '';
  renderCustomList();
}

function removeCustomWord(w){
  customWords = customWords.filter(x => x !== w);
  saveCustom();
  renderCustomList();
}

function renderCustomList(){
  const list = document.getElementById('customWordList');
  const empty = document.getElementById('customEmpty');
  const btn = document.getElementById('btnPracticeCustom');
  list.innerHTML = '';
  if(!customWords.length){
    empty.style.display = '';
    btn.disabled = true;
    return;
  }
  empty.style.display = 'none';
  btn.disabled = false;
  customWords.forEach((w, idx) => {
    const status = wordStatus(CUSTOM_CAT_ID, w);
    const dotColor = status==='mastered'?'#6c5ce7':status==='correct'?'#00b894':status==='wrong'?'#e17055':'#dfe6e9';
    const chip = document.createElement('div');
    chip.className = 'custom-chip';
    chip.innerHTML = `<span class="custom-chip-word">${w}</span><div class="custom-chip-status" style="background:${dotColor}"></div><button class="custom-chip-del" title="Remove">✕</button>`;
    chip.querySelector('.custom-chip-del').addEventListener('click', () => removeCustomWord(w));
    list.appendChild(chip);
  });
}

function showCustom(){
  renderCustomList();
  showScreen('custom');
  setTimeout(()=>document.getElementById('addWordInput').focus(), 200);
}

function startCustom(){
  if(!customWords.length) return;
  const queue = customWords.map(w => ({w, h:'', catId:CUSTOM_CAT_ID})).sort(()=>Math.random()-.5);
  S = {catId:CUSTOM_CAT_ID, queue, idx:0, correct:[], wrong:[], skipped:[]};
  document.getElementById('playLbl').textContent = '✏️ My Words';
  buildPaws(); renderCard(); showScreen('play');
}

/* ═══ STORAGE ═══ */
let progress = {};
try { progress = JSON.parse(localStorage.getItem('katecat_v3')||'{}'); } catch(e){}
function save(){ localStorage.setItem('katecat_v3', JSON.stringify(progress)); }

function logResult(catId, word, correct){
  if(!progress[catId]) progress[catId]={};
  if(!progress[catId][word]) progress[catId][word]=[];
  progress[catId][word].push({ts:Date.now(), r:correct?1:0});
  if(progress[catId][word].length>60) progress[catId][word].shift();
  save();
}
function getHistory(catId, word){
  return (progress[catId]&&progress[catId][word]) ? progress[catId][word] : [];
}
const MASTERED_STREAK = 10;
function wordStatus(catId, word){
  const h=getHistory(catId,word);
  if(!h.length) return 'unseen';
  if(h[h.length-1].r===0) return 'wrong';
  const last10=h.slice(-MASTERED_STREAK);
  if(last10.length>=MASTERED_STREAK && last10.every(e=>e.r===1)) return 'mastered';
  if(h.filter(e=>e.r===1).length>0) return 'correct';
  return 'unseen';
}
function streakCount(catId, word){
  const h=getHistory(catId,word); let s=0;
  for(let i=h.length-1;i>=0;i--){ if(h[i].r===1) s++; else break; }
  return s;
}
function allWordStatuses(){
  let correct=0,wrong=0,mastered=0;
  CATS.forEach(cat=>cat.words.forEach(w=>{
    const s=wordStatus(cat.id,w.w);
    if(s==='mastered') mastered++;
    else if(s==='correct') correct++;
    else if(s==='wrong') wrong++;
  }));
  // also count custom words
  customWords.forEach(w=>{
    const s=wordStatus(CUSTOM_CAT_ID,w);
    if(s==='mastered') mastered++;
    else if(s==='correct') correct++;
    else if(s==='wrong') wrong++;
  });
  return {correct,wrong,mastered};
}

/* ═══ AUDIO ═══ */
let audioCtx=null, goodAudio=null, badAudio=null;
function getCtx(){ if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)(); return audioCtx; }
async function tryLoadAudio(){
  try{
    const ctx=getCtx();
    const [g,b]=await Promise.allSettled([
      fetch('kitten-sfx.mp3').then(r=>r.ok?r.arrayBuffer():Promise.reject()),
      fetch('angry-cat-hq.mp3').then(r=>r.ok?r.arrayBuffer():Promise.reject()),
    ]);
    if(g.status==='fulfilled') goodAudio=await ctx.decodeAudioData(g.value);
    if(b.status==='fulfilled') badAudio=await ctx.decodeAudioData(b.value);
  }catch(e){}
}
function playBuffer(buf,trim=0){
  try{
    const ctx=getCtx(),src=ctx.createBufferSource(); src.buffer=buf;
    const gain=ctx.createGain(); gain.gain.value=0.85;
    src.connect(gain); gain.connect(ctx.destination);
    src.start(0); if(trim>0) src.stop(ctx.currentTime+trim);
  }catch(e){}
}
function playGoodSynth(){
  try{
    const ctx=getCtx(),now=ctx.currentTime;
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);o.type='sine';
    o.frequency.setValueAtTime(320,now);o.frequency.linearRampToValueAtTime(580,now+.1);
    o.frequency.linearRampToValueAtTime(480,now+.22);o.frequency.linearRampToValueAtTime(540,now+.32);
    o.frequency.linearRampToValueAtTime(400,now+.5);
    g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(.22,now+.04);
    g.gain.linearRampToValueAtTime(.18,now+.28);g.gain.linearRampToValueAtTime(0,now+.56);
    o.start(now);o.stop(now+.6);
    const o2=ctx.createOscillator(),g2=ctx.createGain();
    o2.connect(g2);g2.connect(ctx.destination);o2.type='sawtooth';o2.frequency.value=26;
    g2.gain.setValueAtTime(0,now+.1);g2.gain.linearRampToValueAtTime(.07,now+.2);
    g2.gain.linearRampToValueAtTime(.07,now+.48);g2.gain.linearRampToValueAtTime(0,now+.7);
    o2.start(now+.1);o2.stop(now+.75);
  }catch(e){}
}
function playBadSynth(){
  try{
    const ctx=getCtx(),now=ctx.currentTime;
    const bsz=Math.floor(ctx.sampleRate*.55),buf=ctx.createBuffer(1,bsz,ctx.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<bsz;i++) d[i]=(Math.random()*2-1)*.6;
    const src=ctx.createBufferSource();src.buffer=buf;
    const filt=ctx.createBiquadFilter();filt.type='bandpass';filt.frequency.value=3200;filt.Q.value=.7;
    const gain=ctx.createGain();src.connect(filt);filt.connect(gain);gain.connect(ctx.destination);
    gain.gain.setValueAtTime(.45,now);gain.gain.linearRampToValueAtTime(.08,now+.55);src.start(now);
    const osc=ctx.createOscillator(),g2=ctx.createGain();
    osc.connect(g2);g2.connect(ctx.destination);osc.type='sawtooth';
    osc.frequency.setValueAtTime(130,now);osc.frequency.linearRampToValueAtTime(75,now+.45);
    g2.gain.setValueAtTime(.18,now);g2.gain.linearRampToValueAtTime(0,now+.5);
    osc.start(now);osc.stop(now+.55);
  }catch(e){}
}
function playGood(){ if(goodAudio) playBuffer(goodAudio,1); else playGoodSynth(); }
function playBad(){ if(badAudio) playBuffer(badAudio); else playBadSynth(); }

function purrHeroCat(el){
  el.classList.remove('squish');
  void el.offsetWidth;
  el.classList.add('squish');
  setTimeout(()=>el.classList.remove('squish'), 400);
  if(goodAudio){ playBuffer(goodAudio,1); } else {
    try{
      const ctx=getCtx(),now=ctx.currentTime;
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);o.type='sine';
      o.frequency.setValueAtTime(300,now);o.frequency.linearRampToValueAtTime(600,now+.12);
      o.frequency.linearRampToValueAtTime(450,now+.28);o.frequency.linearRampToValueAtTime(520,now+.38);
      o.frequency.linearRampToValueAtTime(380,now+.55);
      g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(.22,now+.05);
      g.gain.linearRampToValueAtTime(.18,now+.3);g.gain.linearRampToValueAtTime(0,now+.6);
      o.start(now);o.stop(now+.65);
      const o2=ctx.createOscillator(),g2=ctx.createGain();
      o2.connect(g2);g2.connect(ctx.destination);o2.type='sawtooth';o2.frequency.value=28;
      g2.gain.setValueAtTime(0,now+.1);g2.gain.linearRampToValueAtTime(.09,now+.2);
      g2.gain.linearRampToValueAtTime(.09,now+.55);g2.gain.linearRampToValueAtTime(0,now+.8);
      o2.start(now+.1);o2.stop(now+.85);
    }catch(e){}
  }
}

/* ═══ PARTICLES ═══ */
function particles(x,y,ok){
  const set=ok?['🐾','⭐','✨','🐱','💛']:['😾','💢','🙀'];
  const n=ok?9:4;
  for(let i=0;i<n;i++){
    setTimeout(()=>{
      const el=document.createElement('div');el.className='particle';
      el.textContent=set[Math.floor(Math.random()*set.length)];
      el.style.left=(x+(Math.random()-.5)*90)+'px';el.style.top=y+'px';
      el.style.animationDuration=(.7+Math.random()*.5)+'s';
      el.style.animationDelay=(Math.random()*.12)+'s';
      document.body.appendChild(el);setTimeout(()=>el.remove(),1500);
    },i*38);
  }
}
function confetti(){
  const c=document.getElementById('confettiCont');
  const set=['🐾','⭐','✨','🎉','💛','🐱','🌟'];
  for(let i=0;i<35;i++){
    const el=document.createElement('div');el.className='conf';
    el.textContent=set[Math.floor(Math.random()*set.length)];
    el.style.left=Math.random()*100+'vw';
    el.style.animationDuration=(1.5+Math.random()*1.5)+'s';
    el.style.animationDelay=(Math.random()*.9)+'s';
    c.appendChild(el);setTimeout(()=>el.remove(),3600);
  }
}

/* ═══ HOME ═══ */
function renderHome(){
  const grid=document.getElementById('catGrid'); grid.innerHTML='';
  // built-in cats
  CATS.forEach(cat=>{
    const words=cat.words;
    const correct=words.filter(w=>wordStatus(cat.id,w.w)==='correct').length;
    const mastered=words.filter(w=>wordStatus(cat.id,w.w)==='mastered').length;
    const pct=Math.round(((correct+mastered)/words.length)*100);
    const card=document.createElement('button'); card.className='c-card';
    card.innerHTML=`<div style="position:absolute;top:0;left:0;right:0;height:4px;background:${cat.bar};border-radius:20px 20px 0 0"></div><span class="cc-emo">${cat.emoji}</span><span class="cc-name">${cat.name}</span><span class="cc-cnt">${words.length} words</span><div class="cc-bar"><div class="cc-fill" style="width:${pct}%;background:${cat.bar}"></div></div>`;
    card.onclick=()=>startCategory(cat.id);
    grid.appendChild(card);
  });
  // custom list card (if any words)
  if(customWords.length){
    const correct=customWords.filter(w=>wordStatus(CUSTOM_CAT_ID,w)==='correct').length;
    const mastered=customWords.filter(w=>wordStatus(CUSTOM_CAT_ID,w)==='mastered').length;
    const pct=Math.round(((correct+mastered)/customWords.length)*100);
    const card=document.createElement('button'); card.className='c-card';
    card.innerHTML=`<div style="position:absolute;top:0;left:0;right:0;height:4px;background:#009896;border-radius:20px 20px 0 0"></div><span class="cc-emo">✏️</span><span class="cc-name">My Words</span><span class="cc-cnt">${customWords.length} words</span><div class="cc-bar"><div class="cc-fill" style="width:${pct}%;background:#009896"></div></div>`;
    card.onclick=()=>startCustom();
    grid.appendChild(card);
  }
  const s=allWordStatuses();
  document.getElementById('sCorrect').textContent=s.correct;
  document.getElementById('sPractice').textContent=s.wrong;
  document.getElementById('sMastered').textContent=s.mastered;
  const missed=getMissed();
  const btn=document.getElementById('btnMissed');
  btn.disabled=missed.length===0;
  btn.textContent=missed.length>0?`🐾 Practice ${missed.length} missed word${missed.length!==1?'s':''}`:`🐾 No missed words yet`;
}
function getMissed(){
  const out=[];
  CATS.forEach(cat=>cat.words.forEach(wObj=>{
    if(wordStatus(cat.id,wObj.w)==='wrong') out.push({...wObj,catId:cat.id});
  }));
  customWords.forEach(w=>{
    if(wordStatus(CUSTOM_CAT_ID,w)==='wrong') out.push({w,h:'',catId:CUSTOM_CAT_ID});
  });
  return out;
}

/* ═══ SESSION ═══ */
let S={catId:null,queue:[],idx:0,correct:[],wrong:[],skipped:[]};
function startCategory(catId){
  const cat=CATS.find(c=>c.id===catId);
  S={catId,queue:[...cat.words].sort(()=>Math.random()-.5),idx:0,correct:[],wrong:[],skipped:[]};
  document.getElementById('playLbl').textContent=cat.name;
  buildPaws(); renderCard(); showScreen('play');
}
function startMissed(){
  const missed=getMissed().sort(()=>Math.random()-.5);
  if(!missed.length) return;
  S={catId:'__missed__',queue:missed,idx:0,correct:[],wrong:[],skipped:[]};
  document.getElementById('playLbl').textContent='🐾 Missed Words';
  buildPaws(); renderCard(); showScreen('play');
}
function buildPaws(){
  const row=document.getElementById('pawsRow');
  const n=Math.min(S.queue.length,20); row.innerHTML='';
  for(let i=0;i<n;i++){
    const p=document.createElement('span');p.className='paw';p.id='paw'+i;p.textContent='🐾';
    row.appendChild(p);
  }
}
function updatePaw(idx,ok){
  const p=document.getElementById('paw'+idx);
  if(p) p.classList.add(ok?'ok':'ng');
}
function renderCard(){
  const {queue,idx}=S,total=queue.length,card=queue[idx];
  const catId=card.catId||S.catId;
  const cat=CATS.find(c=>c.id===catId);
  document.getElementById('playCnt').textContent=`${idx+1} / ${total}`;
  document.getElementById('progFill').style.width=((idx/total)*100)+'%';
  document.getElementById('cardTag').textContent=cat?cat.name.toUpperCase():(catId===CUSTOM_CAT_ID?'MY WORDS':'');
  const wordEl=document.getElementById('cardWord');
  wordEl.textContent=card.w;
  wordEl.style.fontSize='';
  // shrink font until word fits on one line
  requestAnimationFrame(()=>{
    const container=wordEl.parentElement;
    let size=parseFloat(getComputedStyle(wordEl).fontSize);
    const minSize=18;
    while(wordEl.scrollWidth>container.clientWidth-40 && size>minSize){
      size-=1;
      wordEl.style.fontSize=size+'px';
    }
  });
  document.getElementById('cardHint').textContent=card.h||'';
}
function mark(ok){
  const card=S.queue[S.idx];
  const catId=card.catId||S.catId;
  const fc=document.getElementById('flashcard');
  const rect=fc.getBoundingClientRect();
  const cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;
  logResult(catId,card.w,ok);
  if(ok){
    S.correct.push(card); playGood();
    fc.classList.add('anim-ok'); particles(cx,cy,true); updatePaw(S.idx,true);
    setTimeout(()=>{fc.classList.remove('anim-ok');advance();},480);
  } else {
    S.wrong.push(card); playBad();
    fc.classList.add('anim-ng');
    const h=document.getElementById('hissOverlay'); h.classList.add('show');
    particles(cx,cy,false); updatePaw(S.idx,false);
    setTimeout(()=>h.classList.remove('show'),550);
    setTimeout(()=>{fc.classList.remove('anim-ng');advance();},440);
  }
}
function skipCard(){
  S.skipped.push(S.queue[S.idx]);
  const fc=document.getElementById('flashcard');
  fc.classList.add('anim-next');
  setTimeout(()=>{fc.classList.remove('anim-next');advance();},290);
}
function advance(){
  S.idx++;
  if(S.idx>=S.queue.length){showResults();return;}
  const fc=document.getElementById('flashcard');
  fc.classList.add('anim-next');
  setTimeout(()=>{fc.classList.remove('anim-next');renderCard();},155);
}

/* ═══ RESULTS ═══ */
function showResults(){
  const {correct,wrong,queue}=S,total=queue.length;
  const pct=total>0?Math.round((correct.length/total)*100):0;
  document.getElementById('resCat').textContent=pct===100?'🎉':pct>=80?'😸':'😺';
  document.getElementById('resTitle').textContent=pct===100?'🌟 Purrfect!':pct>=80?'😸 Great job!':pct>=60?'😺 Good try!':'😿 Keep going!';
  document.getElementById('resSub').textContent=`${correct.length} of ${total} words correct`;
  document.getElementById('scorePct').textContent=pct+'%';
  if(pct===100) confetti();
  const list=document.getElementById('resList'); list.innerHTML='';
  if(correct.length){
    const h=document.createElement('p');h.className='res-sec';h.textContent='✓ Got it';list.appendChild(h);
    correct.forEach(c=>{const r=document.createElement('div');r.className='res-row';r.innerHTML=`<span class="res-word">${c.w}</span><div class="res-dot" style="background:#55efc4"></div>`;list.appendChild(r);});
  }
  if(wrong.length){
    const h=document.createElement('p');h.className='res-sec';h.textContent='✗ Keep practicing';list.appendChild(h);
    wrong.forEach(c=>{const r=document.createElement('div');r.className='res-row';r.innerHTML=`<span class="res-word">${c.w}</span><div class="res-dot" style="background:#fab1a0"></div>`;list.appendChild(r);});
  }
  const da=document.getElementById('drillArea');
  da.innerHTML=wrong.length
    ?`<button class="btn-primary" style="background:#e17055;box-shadow:0 4px 0 #d63031;margin-bottom:8px" onclick="drillMissed()">🐾 Practice ${wrong.length} missed now</button>`
    :`<div class="perfect-banner">🌟 No missed words — Kate's amazing!</div>`;
  showScreen('results');
}
function drillMissed(){
  const missed=S.wrong.map(w=>({...w,catId:w.catId||S.catId})).sort(()=>Math.random()-.5);
  S={catId:'__missed__',queue:missed,idx:0,correct:[],wrong:[],skipped:[]};
  document.getElementById('playLbl').textContent='🐾 Missed Words';
  buildPaws();renderCard();showScreen('play');
}
function playAgain(){
  const cid=S.catId;
  if(cid==='__missed__') startMissed();
  else if(cid===CUSTOM_CAT_ID) startCustom();
  else startCategory(cid);
}

/* ═══ GALLERY ═══ */
function showGallery(){
  const content=document.getElementById('galleryContent'); content.innerHTML='';
  let total=0;
  const allCats=[...CATS];
  if(customWords.length){
    allCats.push({id:CUSTOM_CAT_ID,name:'My Words',emoji:'✏️',words:customWords.map(w=>({w,h:''}))});
  }
  allCats.forEach(cat=>{
    const words=cat.words.filter(w=>wordStatus(cat.id,w.w)==='mastered');
    if(!words.length) return; total+=words.length;
    const sec=document.createElement('div');sec.className='m-section';
    sec.innerHTML=`<div class="m-sec-hd"><span>${cat.emoji}</span>${cat.name}</div>`;
    const wrap=document.createElement('div');wrap.className='m-wrap';
    words.forEach((word,i)=>{
      const chip=document.createElement('div');chip.className='m-chip';
      chip.style.animationDelay=(i*.04)+'s';chip.textContent='⭐ '+word.w;
      wrap.appendChild(chip);
    });
    sec.appendChild(wrap);content.appendChild(sec);
  });
  if(!total) content.innerHTML='<div class="g-empty"><div class="g-empty-cat">😿</div><p>No mastered words yet!</p><p style="font-size:.75rem;margin-top:.25rem">Get a word right 10 times in a row to master it!</p></div>';
  showScreen('gallery');
}

/* ═══ LOOKUP ═══ */
function showLookup(){
  document.getElementById('searchInput').value='';
  document.getElementById('lookupResult').innerHTML='';
  buildLookupList('');
  showScreen('lookup');
  setTimeout(()=>document.getElementById('searchInput').focus(),180);
}
function onSearch(val){
  const q=val.trim().toLowerCase();
  document.getElementById('lookupResult').innerHTML='';
  buildLookupList(q);
  if(q){
    for(const cat of CATS){
      const found=cat.words.find(w=>w.w.toLowerCase()===q);
      if(found){renderWordCard(cat,found);return;}
    }
    if(customWords.includes(q)){
      renderWordCard({id:CUSTOM_CAT_ID,name:'My Words',bar:'#009896'},{w:q,h:''});
    }
  }
}
function buildLookupList(q){
  const list=document.getElementById('lookupList');list.innerHTML='';
  const results=[];
  const allCats=[...CATS];
  if(customWords.length) allCats.push({id:CUSTOM_CAT_ID,name:'My Words',bar:'#009896',words:customWords.map(w=>({w,h:''}))});
  allCats.forEach(cat=>cat.words.forEach(wObj=>{
    if(!q||wObj.w.toLowerCase().includes(q)){
      const h=getHistory(cat.id,wObj.w);
      if(h.length>0||q) results.push({cat,wObj,h});
    }
  }));
  results.sort((a,b)=>{
    const ta=a.h.length?a.h[a.h.length-1].ts:0,tb=b.h.length?b.h[b.h.length-1].ts:0;
    if(ta!==tb) return tb-ta;
    return a.wObj.w.localeCompare(b.wObj.w);
  });
  results.slice(0,40).forEach(({cat,wObj,h})=>{
    const status=wordStatus(cat.id,wObj.w);
    const dotColor=status==='mastered'?'#6c5ce7':status==='correct'?'#00b894':status==='wrong'?'#e17055':'#dfe6e9';
    const totalOk=h.filter(e=>e.r===1).length,totalAll=h.length;
    const sk=streakCount(cat.id,wObj.w);
    const pctTxt=status==='mastered'?'⭐':status==='unseen'?'unseen':sk>0?`🔥${sk}`:totalAll>0?`${totalOk}/${totalAll}`:'—';
    const row=document.createElement('div');row.className='ll-row';
    row.innerHTML=`<span class="ll-word">${wObj.w}</span><div class="ll-meta"><span class="ll-pct">${pctTxt}</span><div class="ll-dot" style="background:${dotColor}"></div></div>`;
    row.onclick=()=>{document.getElementById('searchInput').value=wObj.w;document.getElementById('lookupResult').innerHTML='';renderWordCard(cat,wObj);};
    list.appendChild(row);
  });
}
function renderWordCard(cat,wObj){
  const result=document.getElementById('lookupResult');result.innerHTML='';
  const h=getHistory(cat.id,wObj.w);
  const totalOk=h.filter(e=>e.r===1).length,totalNg=h.filter(e=>e.r===0).length,totalAll=h.length;
  const pct=totalAll>0?Math.round((totalOk/totalAll)*100):null;
  const streak=streakCount(cat.id,wObj.w),status=wordStatus(cat.id,wObj.w);
  let trend='',trendColor='',trendIcon='';
  if(h.length>=4){
    const half=Math.min(5,Math.floor(h.length/2));
    const recent=h.slice(-half),older=h.slice(-half*2,-half);
    const rp=recent.filter(e=>e.r===1).length/recent.length;
    const op=older.length?older.filter(e=>e.r===1).length/older.length:null;
    if(op!==null){
      const diff=rp-op;
      if(diff>=.25){trend='Improving 🚀';trendColor='#00b894';trendIcon='↑';}
      else if(diff<=-.25){trend='Needs work 😿';trendColor='#e17055';trendIcon='↓';}
      else{trend='Steady 😺';trendColor='#a29bfe';trendIcon='→';}
    }
  }
  const lastSeen=h.length?timeAgo(h[h.length-1].ts):'Never';
  const streakPips=status==='mastered'
    ?`<div style="font-size:.72rem;font-weight:700;color:#6c5ce7;margin-bottom:.65rem">⭐ Mastered — 10 in a row!</div>`
    :streak>0?`<div style="margin-bottom:.65rem"><div style="font-size:.65rem;font-weight:700;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;margin-bottom:4px">Streak to mastery: ${streak}/${MASTERED_STREAK}</div><div style="display:flex;flex-wrap:wrap;gap:3px">${Array.from({length:MASTERED_STREAK},(_,i)=>`<div style="width:18px;height:18px;border-radius:50%;background:${i<streak?'#00b894':'#e8e8e8'};border:2px solid ${i<streak?'#007a55':'#ccc'};display:inline-flex;align-items:center;justify-content:center;font-size:.6rem;color:white">${i<streak?'✓':''}</div>`).join('')}</div></div>`:'';
  const card=document.createElement('div');card.className='word-card';
  card.innerHTML=`<div class="wc-top"><span class="wc-word">${wObj.w}</span><span class="wc-cat" style="background:${cat.bar||'#636e72'}">${cat.name}</span></div>${trend?`<div class="trend-badge" style="background:${trendColor}22;color:${trendColor}">${trendIcon} ${trend}</div>`:''}${streakPips}<div class="wc-stats"><div class="wc-stat"><span class="wc-stat-n" style="color:${pct!==null?(pct>=70?'#00b894':'#e17055'):'#b2bec3'}">${pct!==null?pct+'%':'—'}</span><span class="wc-stat-l">accuracy</span></div><div class="wc-stat"><span class="wc-stat-n" style="color:#00b894">${totalOk}</span><span class="wc-stat-l">correct</span></div><div class="wc-stat"><span class="wc-stat-n" style="color:#e17055">${totalNg}</span><span class="wc-stat-l">missed</span></div><div class="wc-stat"><span class="wc-stat-n" style="color:var(--muted);font-size:.78rem">${lastSeen}</span><span class="wc-stat-l">last seen</span></div></div>${h.length?`<div class="wc-timeline-hd">History (newest first)</div><div class="timeline">${[...h].reverse().slice(0,20).map(e=>`<div class="tl-row"><div class="tl-dot" style="background:${e.r?'#55efc4':'#fab1a0'}"></div><span class="tl-label" style="color:${e.r?'#005a3e':'#c0392b'}">${e.r?'✓ Got it':'✗ Missed'}</span><span class="tl-time">${timeAgo(e.ts)}</span></div>`).join('')}</div>`:'<div class="wc-no-data">No practice history yet 🐱</div>'}`;
  result.appendChild(card);
}
function timeAgo(ts){
  const d=Date.now()-ts,m=Math.floor(d/60000),hr=Math.floor(d/3600000),dy=Math.floor(d/86400000);
  if(m<1) return 'just now';if(m<60) return m+'m ago';if(hr<24) return hr+'h ago';
  if(dy===1) return 'yesterday';if(dy<7) return dy+'d ago';
  if(dy<30) return Math.floor(dy/7)+'w ago';return Math.floor(dy/30)+'mo ago';
}

/* ═══ NAV ═══ */
function goHome(){renderHome();showScreen('home');}
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function toggleFS(){
  const el=document.documentElement;
  if(!document.fullscreenElement){
    (el.requestFullscreen||el.webkitRequestFullscreen||el.mozRequestFullscreen).call(el);
  } else {
    (document.exitFullscreen||document.webkitExitFullscreen||document.mozCancelFullScreen).call(document);
  }
}
function resetAll(){
  if(confirm("Reset all of Kate's progress? This cannot be undone.")){progress={};save();renderHome();}
}

/* INIT */
renderHome();
tryLoadAudio();
</script>
